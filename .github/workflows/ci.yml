name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast naming/format gate: runs before the expensive build jobs so naming
  # regressions fail in seconds. Backed by scripts/validate_naming.py
  # (docs/engineering/NAMING_CONVENTIONS.md) and clang-format --dry-run.
  naming-and-format:
    name: Naming convention & format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install LLVM 23 toolchain (pinned formatter and analyzer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl zstd tar
          bash scripts/install-llvm-23-ubuntu.sh

      - name: Naming validation (scripts/validate_naming.py)
        run: python3 scripts/validate_naming.py

      - name: clang-format check (LLVM 23, repository policy)
        run: bash scripts/check-format-ubuntu.sh

      # C++20 compliance stage: no post-C++20 language or library feature may
      # enter the repository (docs/engineering/CPP20_STANDARDS.md).
      - name: C++20 compliance scan (scripts/check_cpp20_only.py)
        run: python3 scripts/check_cpp20_only.py .

      # Comment audit stage: no residual legacy implementation commentary may
      # return; reviewed provenance/attribution categories stay preserved
      # (docs/engineering/BORNO_COMMENT_MIGRATION.md).
      - name: Comment audit (scripts/audit_comments.py)
        run: python3 scripts/audit_comments.py .

  configuration-validation:
    name: Repository configuration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate JSON configuration files
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          for name in ("CMakePresets.json", "vcpkg.json"):
              json.loads(Path(name).read_text())
              print(f"{name}: valid JSON")
          PY

      - name: CMake preset inventory (CMake configure validation)
        run: |
          pip install cmake ninja
          cmake --list-presets
          cmake --list-presets=build

  ubuntu-clang:
    name: Clang 23 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: naming-and-format
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache vcpkg packages
        uses: actions/cache@v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-clang23-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip tar zstd pkg-config
          bash scripts/install-llvm-23-ubuntu.sh
          bash scripts/install-linux-build-tools.sh

      - name: Install pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-ci

      - name: Check formatting
        run: bash scripts/check-format-ubuntu.sh

      - name: Check module layering
        run: python3 scripts/check-layering.py

      - name: Run clang-tidy
        run: bash scripts/check-tidy-ubuntu.sh build/ubuntu-ci

      - name: Test
        run: |
          cmake --build --preset ubuntu-ci --target suborno_unit_tests suborno_integration_tests
          ctest --preset ubuntu-ci --output-on-failure

      - name: Build
        run: cmake --build --preset ubuntu-ci

  ubuntu-gcc-13:
    name: GCC 13 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache vcpkg packages
        uses: actions/cache@v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-gcc13-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip tar zstd pkg-config
          scripts/install-linux-build-tools.sh
          g++-13 -dumpfullversion | grep -Fx '13.3.0'

      - name: Install pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-gcc-ci

      - name: Test
        run: |
          cmake --build --preset ubuntu-gcc-ci --target suborno_unit_tests suborno_integration_tests
          ctest --preset ubuntu-gcc-ci --output-on-failure

      - name: Build
        run: cmake --build --preset ubuntu-gcc-ci

  windows-msvc:
    name: MSVC v143 / Windows 2022 / x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache vcpkg packages
        uses: actions/cache@v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-msvc-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Unable to clone vcpkg." }
          git -C "$env:VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the pinned vcpkg baseline." }
          git -C "$env:VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          if ($LASTEXITCODE -ne 0) { throw "Unable to check out the pinned vcpkg baseline." }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Test Release
        run: |
          cmake --build --preset windows-msvc-release --target suborno_unit_tests suborno_integration_tests suborno_windows_tests suborno_app
          ctest --preset windows-msvc-release --output-on-failure

      - name: Build Release
        run: cmake --build --preset windows-msvc-release

      - name: Audit Windows binary dependencies
        shell: pwsh
        run: ./scripts/audit-windows-dependencies.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $innoSetupUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_3_3/innosetup-6.3.3.exe"
          # SHA256 of the official innosetup-6.3.3.exe release asset (supply-chain pin).
          $innoSetupSha256 = "0bcb2a409dea17e305a27a6b09555cabe600e984f88570ab72575cd7e93c95e6"
          $innoSetupInstaller = Join-Path $env:TEMP 'inno-setup.exe'
          Invoke-WebRequest -Uri $innoSetupUrl -OutFile $innoSetupInstaller
          $actualSha256 = (Get-FileHash -LiteralPath $innoSetupInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $innoSetupSha256) { throw "Inno Setup installer checksum mismatch: expected $innoSetupSha256, got $actualSha256." }
          $proc = Start-Process -FilePath $innoSetupInstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($proc.ExitCode)." }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }
          & $iscc /Q packaging/windows/suborno_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Test installer lifecycle
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

      - name: Create checksum and inspect signature
        shell: pwsh
        run: |
          $installer = 'packaging/windows/Output/Suborno-Setup-x64.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Suborno-Setup-x64.exe" | Set-Content -Encoding ascii "$installer.sha256"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          Write-Host "Installer Authenticode status: $($signature.Status)"
          if ($signature.Status -notin @('Valid', 'NotSigned')) {
            throw "Unexpected installer signature status: $($signature.Status)"
          }

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: suborno-windows-x64-${{ github.run_number }}
          path: |
            packaging/windows/Output/Suborno-Setup-x64.exe
            packaging/windows/Output/Suborno-Setup-x64.exe.sha256
            build/windows-msvc/Release/Suborno.exe
            build/windows-msvc/Release/suborno_windows_tsf.dll
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14

      - name: Test Debug
        run: |
          cmake --build --preset windows-msvc-debug --target suborno_unit_tests suborno_integration_tests suborno_windows_tests suborno_app
          ctest --preset windows-msvc-debug --output-on-failure

      - name: Build Debug
        run: cmake --build --preset windows-msvc-debug

  ubuntu-sanitizers:
    name: ASan+UBSan / Clang / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache vcpkg packages
        uses: actions/cache@v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-clang23-sanitizers-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip tar zstd pkg-config
          scripts/install-llvm-23-ubuntu.sh
          scripts/install-linux-build-tools.sh

      - name: Install pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-sanitizers-clang

      - name: Build
        run: cmake --build --preset ubuntu-sanitizers-clang

      - name: Test
        run: ctest --preset ubuntu-sanitizers-clang --output-on-failure

  linux-system-deps:
    name: System deps build + fuzz smoke / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Exercises the non-vcpkg dependency fallback in CMakeLists.txt
      # (system ICU + system SQLite) and the libFuzzer smoke run.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build libicu-dev libsqlite3-dev

      - name: Configure
        run: |
          cmake -S . -B build/system-deps -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DSUBORNO_BUILD_FUZZING=ON

      - name: Build
        run: cmake --build build/system-deps --target suborno_core suborno_dictionary_import suborno_phonetic_fuzz

      - name: Import seed dictionary and verify
        run: |
          set -e
          ./build/system-deps/suborno_dictionary_import /tmp/seed_test.sqlite data/seed_dictionary.tsv
          python3 - << 'PY'
          import sqlite3
          db = sqlite3.connect('/tmp/seed_test.sqlite')
          count = db.execute("select count(*) from dictionary_entries where source='system'").fetchone()[0]
          assert count >= 700, f"seed dictionary import too small: {count}"
          sample = db.execute("select normalized from dictionary_entries limit 1").fetchone()[0]
          assert sample, "seed dictionary has empty word"
          print(f"seed dictionary rows: {count}")
          PY

      - name: Fuzz smoke (30s)
        run: |
          # Versioned seeds (tests/fuzz/corpus stays read-only; mutations land
          # in /tmp/fuzz-artifacts) + the libFuzzer dictionary from audit #2.
          ./build/system-deps/suborno_phonetic_fuzz \
            tests/fuzz/corpus /tmp/fuzz-artifacts \
            -dict=tests/fuzz/dictionaries/phonetic.dict \
            -max_total_time=30 -print_final_stats=1

      - name: Fuzz smoke (portable driver, both targets)
        run: |
          cmake --build build/system-deps --target suborno_fuzz_smoke
          ./build/system-deps/suborno_fuzz_smoke tests/fuzz/corpus

  cppcheck:
    name: Cppcheck static analysis / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck (warnings, performance, portability)
        run: bash scripts/cppcheck-ubuntu.sh

  doxygen-docs:
    name: Doxygen documentation build / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Configure (documentation target)
        run: cmake -S . -B build/docs -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUBORNO_ENABLE_MSVC_ANALYSIS=OFF

      - name: Build API documentation (zero warnings required)
        run: cmake --build build/docs --target docs

      - name: Verify generated documentation
        run: |
          test -f build/docs/docs/api/html/index.html || test -f build/docs/api/html/index.html
          echo "Doxygen HTML reference generated."

  license-and-dependency-review:
    name: License validation & dependency review / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: License validation (scripts/audit_licenses.py)
        run: python3 scripts/audit_licenses.py .

      - name: Dependency notice cross-check
        run: |
          # Every vcpkg dependency must appear in the notices file; the
          # CodeQL job provides the security half of the dependency review.
          python3 - << 'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("vcpkg.json").read_text())
          names = [d if isinstance(d, str) else d.get("name") for d in manifest.get("dependencies", [])]
          notices = Path("THIRD_PARTY_NOTICES.md").read_text().lower()
          missing = [n for n in names if n and n.lower() not in notices]
          assert not missing, f"dependencies missing from THIRD_PARTY_NOTICES.md: {missing}"
          print(f"dependency notices: OK ({len(names)} dependencies)")
          PY

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libicu-dev libsqlite3-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-extended

      - name: Build (instrumented by CodeQL)
        run: |
          cmake -S . -B build/codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUBORNO_ENABLE_MSVC_ANALYSIS=OFF \
          cmake --build build/codeql --target suborno_core 2>&1 || \
          cmake --build build/codeql 2>&1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
