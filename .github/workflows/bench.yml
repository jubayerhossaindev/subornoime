# Weekly benchmark run (structure audit #2, gap 8).
# Runs the three named suites over the hot paths (dictionary I/O, engine
# sessions, cross-domain infrastructure) and archives the JSON results so a
# release can be compared against the previous week. Preset-driven: the
# `ubuntu-bench` preset is ubuntu-ci plus SUBORNO_BUILD_BENCHMARKS=ON.
name: Weekly Bench

on:
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google-benchmark:
    name: Benchmarks / Clang 23 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache vcpkg packages
        uses: actions/cache@v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-clang23-bench-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip tar zstd pkg-config
          bash scripts/install-llvm-23-ubuntu.sh
          bash scripts/install-linux-build-tools.sh

      - name: Install pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-bench

      - name: Build benchmarks
        run: cmake --build --preset ubuntu-bench --target suborno_benchmarks

      - name: Run benchmarks (JSON)
        run: |
          ./build/ubuntu-bench/suborno_benchmarks \
            --benchmark_format=json \
            --benchmark_out=bench-results.json \
            --benchmark_min_time=0.2s

      - name: Upload results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bench-results-${{ github.run_number }}
          path: bench-results.json
          if-no-files-found: error
          retention-days: 90
