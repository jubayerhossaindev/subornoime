# Nightly fuzz session (structure audit #2, gap 1 + gap 6).
# The CI fuzz smoke (ci.yml, linux-system-deps) proves the target builds and
# survives 30s; this workflow runs the longer capped session over the
# versioned corpus with the libFuzzer dictionary. System ICU + SQLite keep
# the job fast — no vcpkg bootstrap needed.
name: Nightly Fuzz

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Fuzz session length in seconds'
        required: false
        default: '600'

permissions:
  contents: read

concurrency:
  group: nightly-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libfuzzer-phonetic:
    name: libFuzzer / phonetic engine / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build libicu-dev libsqlite3-dev

      - name: Configure (libFuzzer on)
        run: |
          cmake -S . -B build/nightly-fuzz -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUBORNO_BUILD_FUZZING=ON

      - name: Build fuzz target
        run: cmake --build build/nightly-fuzz --target suborno_phonetic_fuzz

      - name: Fuzz session (capped)
        run: |
          FUZZ_SECONDS="${{ github.event.inputs.fuzz_seconds || '600' }}"
          mkdir -p /tmp/fuzz-artifacts
          ./build/nightly-fuzz/suborno_phonetic_fuzz \
            tests/fuzz/corpus /tmp/fuzz-artifacts \
            -dict=tests/fuzz/dictionaries/phonetic.dict \
            -max_total_time="$FUZZ_SECONDS" \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fuzz-crashes-${{ github.run_number }}
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*
          if-no-files-found: ignore
          retention-days: 30
